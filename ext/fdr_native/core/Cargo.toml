[package]
name = "fdr-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Core fd-style file search library for the fdr gem"
license = "MIT"
repository = "https://github.com/havenwood/fdr"
publish = false

[lints]
workspace = true

[dependencies]
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1.12"

[dev-dependencies]
tempfile = "3.14"
