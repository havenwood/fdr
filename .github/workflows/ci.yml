name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby-version: ['3.2', '3.3', '3.4', '4.0']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Test checkout and packaged gem
        run: bundle exec rake test gem:verify

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run static and Rust checks
        run: bundle exec rake rust:check rbs standard

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install minimum Rust version
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check minimum Rust version
        run: cargo +1.88.0 check --manifest-path ext/seen_native/Cargo.toml --locked --workspace --all-targets --all-features
